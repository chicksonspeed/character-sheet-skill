<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Sheet Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #0c0a0d;
    --card: #16141a;
    --border: #2a2730;
    --text: #f0eef5;
    --muted: #9b97a6;
    --accent: #e35d8c;
    --accent2: #c6e35a;
    --yellow: #f5d76e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  h1 { font-size: 2.4rem; margin: 0 0 8px; letter-spacing: -0.03em; }
  .subtitle { color: var(--muted); margin-bottom: 32px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin: 14px 0 6px;
    color: var(--yellow);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input, textarea, select {
    width: 100%;
    background: #0e0c10;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 1rem;
    font-family: inherit;
  }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  .hw-row {
    display: grid;
    grid-template-columns: 1fr 90px;
    gap: 8px;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0 4px;
  }
  .tag {
    background: #0e0c10;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    user-select: none;
  }
  .tag:hover, .tag.active {
    border-color: var(--accent);
    background: rgba(227, 93, 140, 0.12);
  }
  .photos {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .photo-slot {
    width: 100px;
    height: 100px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    background: #0e0c10;
  }
  .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
  .photo-slot span { font-size: 0.75rem; color: var(--muted); text-align: center; padding: 8px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .note { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
  .success { color: var(--accent2); font-weight: 600; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Character Sheet</h1>
  <p class="subtitle">Fill in the details and upload reference photos. Download a zip you can drop into any image model.</p>

  <div class="card">
    <div class="row">
      <div>
        <label>Name</label>
        <input id="name" placeholder="Will" />
      </div>
      <div>
        <label>Role / Stats</label>
        <select id="role">
          <option value="">Select…</option>
          <option>Versatile</option>
          <option>Top</option>
          <option>Bottom</option>
          <option>Switch</option>
          <option>Vers Top</option>
          <option>Vers Bottom</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Height</label>
        <div class="hw-row">
          <input id="heightValue" type="number" min="140" max="220" placeholder="182" />
          <select id="heightUnit">
            <option value="cm">cm</option>
            <option value="ft">ft/in</option>
          </select>
        </div>
      </div>
      <div>
        <label>Weight</label>
        <div class="hw-row">
          <input id="weightValue" type="number" min="40" max="200" placeholder="73" />
          <select id="weightUnit">
            <option value="kg">kg</option>
            <option value="lbs">lbs</option>
          </select>
        </div>
      </div>
    </div>

    <label>Appearance</label>
    <div class="tags" id="appearanceTags"></div>
    <textarea id="appearance" placeholder="Click tags above or type your own…"></textarea>

    <label>Personal Style</label>
    <div class="tags" id="styleTags"></div>
    <textarea id="style" placeholder="Click tags above or type your own…"></textarea>

    <label>Vibe</label>
    <div class="tags" id="vibeTags"></div>
    <textarea id="vibe" placeholder="Click tags above or type your own…"></textarea>

    <label>Extra Notes</label>
    <textarea id="notes" placeholder="Anything else for the NOTES section…"></textarea>
  </div>

  <div class="card">
    <label>Reference Photos</label>
    <p class="note">Upload 1–4 clear photos (face close-up + body shots work best).</p>
    <div class="photos" id="photoGrid">
      <div class="photo-slot" data-index="0"><span>Photo 1</span></div>
      <div class="photo-slot" data-index="1"><span>Photo 2</span></div>
      <div class="photo-slot" data-index="2"><span>Photo 3</span></div>
      <div class="photo-slot" data-index="3"><span>Photo 4</span></div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden />
  </div>

  <button id="generate">Download Zip</button>
  <div id="status" class="success"></div>
</div>

<script>
const TAGS = {
  appearance: [
    "athletic", "lean muscular", "muscular", "slim", "stocky", "toned", "broad shoulders", "narrow waist", "defined abs",
    "medium tan", "fair skin", "olive skin", "dark skin", "light skin", "sun-kissed", "pale",
    "brown eyes", "blue eyes", "green eyes", "hazel eyes", "dark eyes", "light eyes", "grey eyes",
    "short hair", "textured hair", "messy hair", "styled hair", "undercut", "buzzed", "long hair", "curly hair",
    "pink hair", "blond hair", "dark hair", "brown hair", "black hair", "dyed hair", "bleached hair", "silver hair",
    "beard", "full beard", "stubble", "clean shaven", "mustache", "goatee", "trimmed beard",
    "strong jawline", "soft features", "sharp features", "high cheekbones", "full lips", "defined brows",
    "confident presence", "relaxed presence", "intense gaze", "friendly face", "smirk", "serious expression"
  ],
  style: [
    "edgy", "confident", "stylish", "casual", "refined", "laid-back", "streetwear", "minimal", "summer casual",
    "clean lines", "accessories", "layered", "monochrome", "bold colors", "neutral tones",
    "chain necklace", "sunglasses", "hoodie", "leather jacket", "denim", "tank top", "button-up",
    "jewelry", "rings", "earring", "bracelet", "cap", "beanie", "boots", "sneakers",
    "oversized", "fitted", "athleisure", "smart casual", "nightlife", "daytime casual"
  ],
  vibe: [
    "cool", "versatile", "approachable", "mysterious", "playful", "intense", "chill", "confident",
    "flirty", "aloof", "warm", "magnetic", "charismatic", "calm", "energetic", "laid-back",
    "bold", "subtle", "teasing", "serious", "friendly", "distant", "inviting", "guarded",
    "night owl", "party energy", "low-key", "high-energy", "smooth", "rough around the edges"
  ]
};

function setupTags(containerId, textareaId, words) {
  const container = document.getElementById(containerId);
  const textarea = document.getElementById(textareaId);
  words.forEach(word => {
    const el = document.createElement('span');
    el.className = 'tag';
    el.textContent = word;
    el.addEventListener('click', () => {
      const current = textarea.value.trim();
      const parts = current ? current.split(/,\s*/).filter(Boolean) : [];
      if (parts.includes(word)) {
        textarea.value = parts.filter(p => p !== word).join(', ');
        el.classList.remove('active');
      } else {
        parts.push(word);
        textarea.value = parts.join(', ');
        el.classList.add('active');
      }
    });
    container.appendChild(el);
  });
}

setupTags('appearanceTags', 'appearance', TAGS.appearance);
setupTags('styleTags', 'style', TAGS.style);
setupTags('vibeTags', 'vibe', TAGS.vibe);

const photos = [null, null, null, null];
const photoFiles = [null, null, null, null];
const fileInput = document.getElementById('fileInput');
const photoGrid = document.getElementById('photoGrid');

photoGrid.addEventListener('click', (e) => {
  const slot = e.target.closest('.photo-slot');
  if (!slot) return;
  fileInput.dataset.index = slot.dataset.index;
  fileInput.click();
});

fileInput.addEventListener('change', () => {
  const idx = parseInt(fileInput.dataset.index || '0', 10);
  const file = fileInput.files[0];
  if (!file) return;
  photoFiles[idx] = file;
  const reader = new FileReader();
  reader.onload = () => {
    photos[idx] = reader.result;
    const slot = photoGrid.querySelector(`[data-index="${idx}"]`);
    slot.innerHTML = `<img src="${reader.result}" alt="ref ${idx+1}">`;
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

function getHeight() {
  const v = document.getElementById('heightValue').value.trim();
  const unit = document.getElementById('heightUnit').value;
  if (!v) return '—';
  if (unit === 'cm') return `${v} cm`;
  // rough ft/in conversion display
  const totalIn = Math.round(parseFloat(v) / 2.54);
  const ft = Math.floor(totalIn / 12);
  const inches = totalIn % 12;
  return `${v} cm (${ft}'${inches}")`;
}

function getWeight() {
  const v = document.getElementById('weightValue').value.trim();
  const unit = document.getElementById('weightUnit').value;
  if (!v) return '—';
  if (unit === 'kg') return `${v} kg`;
  const kg = Math.round(parseFloat(v) / 2.2046);
  return `${v} lbs (${kg} kg)`;
}

function val(id) {
  return document.getElementById(id).value.trim() || '—';
}

document.getElementById('generate').addEventListener('click', async () => {
  const btn = document.getElementById('generate');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = 'Building zip...';

  const nameRaw = val('name');
  const name = nameRaw.replace(/[^a-z0-9]/gi, '_') || 'character';

  const prompt = `STRICT CHARACTER REFERENCE SHEET LAYOUT. Black background. Do not deviate from this structure.

LEFT SIDEBAR (narrow vertical panel, black background):
- Very large bold white text: "${nameRaw || 'CHARACTER'}"
- Small yellow text underneath: "CHARACTER SHEET"
- Status block: "ONLINE" + time + distance
- Section titled "STATS" with three lines (role, height, weight) with small icons
- Section titled "APPEARANCE" with 6–8 bullet points
- Section titled "PERSONAL STYLE" with 3–4 bullet points
- Section titled "VIBE" with one short paragraph
- Section titled "COLOR PALETTE" with exactly four color squares labeled Hair / Eyes / Skin / Beard
- Section titled "STYLE PALETTE" with exactly four color squares

TOP RIGHT (three photos in a row, labeled 01, 02, 03 in the top-left corner of each photo):
- Photo 01, Photo 02, Photo 03 using the uploaded reference images

BOTTOM CENTER (white background turnaround):
- Four full-body views side by side labeled exactly: FRONT | LEFT PROFILE | RIGHT PROFILE | BACK
- Same person across all four angles, shirtless, black pants, consistent face and body from the uploaded references

FAR RIGHT PANEL:
- Section titled "DETAILS" with three stacked close-up crops (hair, eyes, lower face)
- Section titled "NOTES" with a short paragraph

Use the uploaded photos as the primary visual reference for face, body, and appearance. Keep the character highly consistent across every view. Clean modern sans-serif typography, high contrast white and yellow text on black, professional character sheet aesthetic, sharp, photorealistic.

Character information:
Name: ${nameRaw || '—'}
Height: ${getHeight()}
Weight: ${getWeight()}
Role: ${val('role')}
Appearance: ${val('appearance')}
Style: ${val('style')}
Vibe: ${val('vibe')}
Notes: ${val('notes')}
`;

  const instructions = `CHARACTER SHEET PACKAGE
======================

How to use:
1. Upload the images in the /photos folder as reference images.
2. Paste the contents of prompt.txt as your prompt.
3. Works with Grok, Flux, Midjourney, Ideogram, and most image generators that accept reference photos.

Files:
- prompt.txt     → full strict-layout character sheet prompt
- photos/        → reference images (01, 02, 03...)
`;

  try {
    const zip = new JSZip();
    zip.file('prompt.txt', prompt);
    zip.file('INSTRUCTIONS.txt', instructions);

    const photosFolder = zip.folder('photos');
    let photoCount = 0;
    for (let i = 0; i < photoFiles.length; i++) {
      if (photoFiles[i]) {
        const ext = photoFiles[i].name.split('.').pop() || 'png';
        photosFolder.file(`0${i+1}.${ext}`, photoFiles[i]);
        photoCount++;
      }
    }

    const blob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${name}_character_sheet.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    status.textContent = `Downloaded ${name}_character_sheet.zip (${photoCount} photo${photoCount === 1 ? '' : 's'})`;
  } catch (err) {
    status.textContent = 'Error building zip: ' + err.message;
  }

  btn.disabled = false;
});
</script>
</body>
</html>
