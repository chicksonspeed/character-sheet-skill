<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Sheet Generator</title>
<style>
  :root {
    --bg: #0c0a0d;
    --card: #16141a;
    --border: #2a2730;
    --text: #f0eef5;
    --muted: #9b97a6;
    --accent: #e35d8c;
    --accent2: #c6e35a;
    --yellow: #f5d76e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  h1 {
    font-size: 2.4rem;
    margin: 0 0 8px;
    letter-spacing: -0.03em;
  }
  .subtitle {
    color: var(--muted);
    margin-bottom: 32px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin: 14px 0 6px;
    color: var(--yellow);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input, textarea, select {
    width: 100%;
    background: #0e0c10;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 1rem;
    font-family: inherit;
  }
  textarea { min-height: 80px; resize: vertical; }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  .photos {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .photo-slot {
    width: 100px;
    height: 100px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    background: #0e0c10;
  }
  .photo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .photo-slot span {
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
    padding: 8px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
  }
  button:hover { filter: brightness(1.1); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    margin-top: 10px;
  }
  #output {
    display: none;
    white-space: pre-wrap;
    background: #0e0c10;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.85rem;
    line-height: 1.45;
    max-height: 480px;
    overflow: auto;
  }
  .note {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 6px;
  }
  .success {
    color: var(--accent2);
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Character Sheet</h1>
  <p class="subtitle">Fill in the details and upload reference photos. Get a ready-to-use prompt for a strict Will-style character sheet.</p>

  <div class="card">
    <div class="row">
      <div>
        <label>Name</label>
        <input id="name" placeholder="Will" />
      </div>
      <div>
        <label>Role / Stats</label>
        <input id="role" placeholder="Versatile" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>Height</label>
        <input id="height" placeholder="182 cm (6'0")" />
      </div>
      <div>
        <label>Weight</label>
        <input id="weight" placeholder="73 kg (161 lbs)" />
      </div>
    </div>
    <label>Appearance</label>
    <textarea id="appearance" placeholder="Athletic / lean muscular build, medium tan skin, brown eyes, short textured pink hair, well-groomed beard, strong jawline..."></textarea>
    <label>Personal Style</label>
    <textarea id="style" placeholder="Edgy, confident, stylish. Switches between laid-back casual and refined. Accessories: chain necklace, sunglasses."></textarea>
    <label>Vibe</label>
    <textarea id="vibe" placeholder="Cool, versatile, approachable, with a hint of mystery."></textarea>
    <label>Extra Notes</label>
    <textarea id="notes" placeholder="Anything else for the NOTES section..."></textarea>
  </div>

  <div class="card">
    <label>Reference Photos</label>
    <p class="note">Upload 1–4 clear photos (face close-up + body shots work best). They’ll be referenced in the prompt.</p>
    <div class="photos" id="photoGrid">
      <div class="photo-slot" data-index="0"><span>Photo 1</span></div>
      <div class="photo-slot" data-index="1"><span>Photo 2</span></div>
      <div class="photo-slot" data-index="2"><span>Photo 3</span></div>
      <div class="photo-slot" data-index="3"><span>Photo 4</span></div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden />
  </div>

  <button id="generate">Generate Prompt</button>
  <button class="secondary" id="copy" style="display:none">Copy Prompt</button>

  <div class="card" id="outputCard" style="display:none">
    <div class="success" id="status"></div>
    <div id="output"></div>
  </div>
</div>

<script>
const photos = [null, null, null, null];
const fileInput = document.getElementById('fileInput');
const photoGrid = document.getElementById('photoGrid');

photoGrid.addEventListener('click', (e) => {
  const slot = e.target.closest('.photo-slot');
  if (!slot) return;
  fileInput.dataset.index = slot.dataset.index;
  fileInput.click();
});

fileInput.addEventListener('change', () => {
  const idx = parseInt(fileInput.dataset.index || '0', 10);
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    photos[idx] = reader.result;
    const slot = photoGrid.querySelector(`[data-index="${idx}"]`);
    slot.innerHTML = `<img src="${reader.result}" alt="ref ${idx+1}">`;
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

function val(id) {
  return document.getElementById(id).value.trim() || '—';
}

document.getElementById('generate').addEventListener('click', () => {
  const name = val('name');
  const prompt = `STRICT CHARACTER REFERENCE SHEET LAYOUT. Black background. Do not deviate from this structure.

LEFT SIDEBAR (narrow vertical panel, black background):
- Very large bold white text: "${name}"
- Small yellow text underneath: "CHARACTER SHEET"
- Status block: "ONLINE" + time + distance
- Section titled "STATS" with three lines (role, height, weight) with small icons
- Section titled "APPEARANCE" with 6–8 bullet points
- Section titled "PERSONAL STYLE" with 3–4 bullet points
- Section titled "VIBE" with one short paragraph
- Section titled "COLOR PALETTE" with exactly four color squares labeled Hair / Eyes / Skin / Beard
- Section titled "STYLE PALETTE" with exactly four color squares

TOP RIGHT (three photos in a row, labeled 01, 02, 03 in the top-left corner of each photo):
- Photo 01, Photo 02, Photo 03 using the uploaded reference images

BOTTOM CENTER (white background turnaround):
- Four full-body views side by side labeled exactly: FRONT | LEFT PROFILE | RIGHT PROFILE | BACK
- Same person across all four angles, shirtless, black pants, consistent face and body from the uploaded references

FAR RIGHT PANEL:
- Section titled "DETAILS" with three stacked close-up crops (hair, eyes, lower face)
- Section titled "NOTES" with a short paragraph

Use the uploaded photos as the primary visual reference for face, body, and appearance. Keep the character highly consistent across every view. Clean modern sans-serif typography, high contrast white and yellow text on black, professional character sheet aesthetic, sharp, photorealistic.

Character information:
Name: ${name}
Height: ${val('height')}
Weight: ${val('weight')}
Role: ${val('role')}
Appearance: ${val('appearance')}
Style: ${val('style')}
Vibe: ${val('vibe')}
Notes: ${val('notes')}

Reference photos provided: ${photos.filter(Boolean).length} image(s).`;

  const output = document.getElementById('output');
  output.textContent = prompt;
  output.style.display = 'block';
  document.getElementById('outputCard').style.display = 'block';
  document.getElementById('status').textContent = 'Prompt ready — copy it into Grok, Flux, Midjourney, or any image generator that accepts reference images.';
  document.getElementById('copy').style.display = 'block';
});

document.getElementById('copy').addEventListener('click', () => {
  const text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('status').textContent = 'Copied to clipboard.';
  });
});
</script>
</body>
</html>
