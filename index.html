<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Sheet Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #0c0a0d;
    --card: #16141a;
    --border: #2a2730;
    --text: #f0eef5;
    --muted: #9b97a6;
    --accent: #e35d8c;
    --accent2: #c6e35a;
    --yellow: #f5d76e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 28px;
  }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; }
  }
  h1 { font-size: 2.2rem; margin: 0 0 6px; letter-spacing: -0.03em; }
  .subtitle { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    margin: 12px 0 5px;
    color: var(--yellow);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input, textarea, select {
    width: 100%;
    background: #0e0c10;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea { min-height: 60px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  .hw-row { display: grid; grid-template-columns: 1fr 80px; gap: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
  .tag {
    background: #0e0c10;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 0.8rem;
    cursor: pointer;
    user-select: none;
  }
  .tag:hover, .tag.active { border-color: var(--accent); background: rgba(227, 93, 140, 0.12); }
  .sublabel { font-size: 0.72rem; color: var(--muted); margin: 8px 0 2px; }
  .photos { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .photo-slot {
    width: 88px;
    height: 88px;
    border: 2px dashed var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    background: #0e0c10;
    position: relative;
  }
  .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
  .photo-slot span { font-size: 0.7rem; color: var(--muted); text-align: center; padding: 6px; }
  .badge {
    position: absolute;
    bottom: 4px;
    left: 4px;
    right: 4px;
    background: rgba(0,0,0,0.7);
    color: white;
    font-size: 0.65rem;
    text-align: center;
    border-radius: 4px;
    padding: 2px 0;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
  }
  button:hover { filter: brightness(1.1); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { flex: 1; }
  .note { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .success { color: var(--accent2); font-weight: 600; margin-top: 10px; font-size: 0.9rem; }
  .preview {
    background: #111;
    border-radius: 12px;
    padding: 12px;
    font-size: 0.75rem;
    min-height: 420px;
  }
  .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .swatches { display: flex; gap: 4px; }
  .swatch { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #333; }
  .preview-name { font-size: 1.4rem; font-weight: 700; }
  .preview-sub { color: var(--yellow); font-size: 0.7rem; }
  .preview-section { margin: 8px 0; }
  .preview-section strong { color: var(--yellow); }
  .palette-row { display: flex; gap: 6px; margin-top: 4px; }
  .palette-swatch { width: 28px; height: 28px; border-radius: 6px; border: 1px solid #333; }
  .char-block { border: 1px dashed var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .remove-char { float: right; background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Character Sheet</h1>
    <p class="subtitle">Fill details, upload photos, download a ready-to-use zip. Live preview on the right.</p>

    <div id="characters"></div>

    <div class="card">
      <button class="secondary" id="addChar">+ Add another character (batch)</button>
    </div>

    <div class="card">
      <label>Format</label>
      <select id="format">
        <option value="classic">Classic Black</option>
        <option value="white">Clean White</option>
        <option value="story">Story (9:16)</option>
      </select>
      <label>Reference Strength</label>
      <select id="strength">
        <option value="strict">Strict likeness</option>
        <option value="balanced" selected>Balanced</option>
        <option value="loose">Loose / stylized</option>
      </select>
      <label>Variations</label>
      <select id="variations">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
      <label style="margin-top:14px;">
        <input type="checkbox" id="blankText" style="width:auto; margin-right:8px;"> Blank text areas (for clean overlay later)
      </label>
      <label>
        <input type="checkbox" id="turnaroundOnly" style="width:auto; margin-right:8px;"> Also include turnaround-only prompt
      </label>
    </div>

    <div class="btn-row">
      <button id="generate">Download Zip</button>
      <button class="secondary" id="openGrok">Copy for Grok</button>
    </div>
    <div class="btn-row">
      <button class="secondary" id="save">Save Profile</button>
      <button class="secondary" id="load">Load Last</button>
    </div>
    <div id="status" class="success"></div>
  </div>

  <div>
    <div class="card">
      <div class="preview-header">
        <strong>Live Preview</strong>
        <div class="swatches" id="previewSwatches"></div>
      </div>
      <div class="preview" id="preview">
        <div class="preview-name" id="pName">NAME</div>
        <div class="preview-sub">CHARACTER SHEET</div>
        <div class="preview-section"><strong>STATS</strong><br><span id="pStats">—</span></div>
        <div class="preview-section"><strong>APPEARANCE</strong><br><span id="pApp">—</span></div>
        <div class="preview-section"><strong>STYLE</strong><br><span id="pStyle">—</span></div>
        <div class="preview-section"><strong>VIBE</strong><br><span id="pVibe">—</span></div>
        <div class="preview-section"><strong>PALETTE</strong>
          <div class="palette-row" id="pPalette"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const TAGS = {
  body: ["athletic","lean muscular","muscular","slim","stocky","toned","broad shoulders","narrow waist","defined abs","thick thighs","long legs","compact","tall frame","short frame","v-taper","soft","cut","bulk","swimmer build","runner build"],
  skin: ["medium tan","fair skin","olive skin","dark skin","light skin","sun-kissed","pale","freckles","warm undertone","cool undertone","neutral undertone","golden","porcelain","deep","medium","light medium"],
  hair: ["short hair","textured hair","messy hair","styled hair","undercut","buzzed","long hair","curly hair","wavy hair","straight hair","slicked back","pink hair","blond hair","dark hair","brown hair","black hair","dyed hair","bleached hair","silver hair","red hair","blue hair","platinum","ash blond","crew cut","fade","man bun","middle part","side part"],
  face: ["brown eyes","blue eyes","green eyes","hazel eyes","dark eyes","light eyes","grey eyes","amber eyes","beard","full beard","stubble","clean shaven","mustache","goatee","trimmed beard","strong jawline","soft features","sharp features","high cheekbones","full lips","defined brows","thick brows","confident presence","relaxed presence","intense gaze","friendly face","smirk","serious expression","boyish face","mature face"],
  style: ["edgy","confident","stylish","casual","refined","laid-back","streetwear","minimal","summer casual","clean lines","accessories","layered","monochrome","bold colors","neutral tones","oversized","fitted","athleisure","smart casual","nightlife","daytime casual","workwear","preppy","grunge","techwear","chain necklace","sunglasses","hoodie","leather jacket","denim","tank top","button-up","t-shirt","jewelry","rings","earring","bracelet","cap","beanie","boots","sneakers","loafers","silver jewelry","gold jewelry","cross necklace","choker","watch","bag","backpack"],
  vibe: ["cool","versatile","approachable","mysterious","playful","intense","chill","confident","flirty","aloof","warm","magnetic","charismatic","calm","energetic","laid-back","bold","subtle","teasing","serious","friendly","distant","inviting","guarded","night owl","party energy","low-key","high-energy","smooth","rough around the edges","sweet","dominant","submissive energy","bratty","soft","stoic","expressive","shy","outgoing","dry humor","chaotic","grounded","dreamy"]
};

let characters = [];
let charId = 0;

function createCharBlock(data = {}) {
  const id = charId++;
  const div = document.createElement('div');
  div.className = 'char-block card';
  div.dataset.id = id;
  div.innerHTML = `
    <button class="remove-char" data-id="${id}">✕ Remove</button>
    <div class="row">
      <div><label>Name</label><input class="c-name" value="${data.name||''}" placeholder="Will"></div>
      <div><label>Role</label>
        <select class="c-role">
          <option value="">Select…</option>
          <option ${data.role==='Versatile'?'selected':''}>Versatile</option>
          <option ${data.role==='Top'?'selected':''}>Top</option>
          <option ${data.role==='Bottom'?'selected':''}>Bottom</option>
          <option ${data.role==='Switch'?'selected':''}>Switch</option>
          <option ${data.role==='Vers Top'?'selected':''}>Vers Top</option>
          <option ${data.role==='Vers Bottom'?'selected':''}>Vers Bottom</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label>Height</label><div class="hw-row"><input class="c-height" type="number" min="140" max="220" value="${data.height||''}" placeholder="182"><select class="c-hunit"><option value="cm">cm</option><option value="ft">ft/in</option></select></div></div>
      <div><label>Weight</label><div class="hw-row"><input class="c-weight" type="number" min="40" max="200" value="${data.weight||''}" placeholder="73"><select class="c-wunit"><option value="kg">kg</option><option value="lbs">lbs</option></select></div></div>
    </div>
    <label>Appearance</label>
    <div class="sublabel">Body Type</div><div class="tags" data-group="body"></div>
    <div class="sublabel">Skin</div><div class="tags" data-group="skin"></div>
    <div class="sublabel">Hair</div><div class="tags" data-group="hair"></div>
    <div class="sublabel">Eyes & Face</div><div class="tags" data-group="face"></div>
    <textarea class="c-appearance" placeholder="Click tags or type…">${data.appearance||''}</textarea>
    <label>Personal Style</label>
    <div class="tags" data-group="style"></div>
    <textarea class="c-style" placeholder="Click tags or type…">${data.style||''}</textarea>
    <label>Vibe</label>
    <div class="tags" data-group="vibe"></div>
    <textarea class="c-vibe" placeholder="Click tags or type…">${data.vibe||''}</textarea>
    <label>Extra Notes</label>
    <textarea class="c-notes" placeholder="Notes…">${data.notes||''}</textarea>
    <label>Reference Photos</label>
    <p class="note">1–4 clear photos. Face close-up recommended.</p>
    <div class="photos"></div>
    <input type="file" class="file-input" accept="image/*" hidden>
  `;
  document.getElementById('characters').appendChild(div);
  setupTags(div);
  setupPhotos(div);
  div.querySelector('.remove-char').onclick = () => { div.remove(); updatePreview(); };
  div.querySelectorAll('input,textarea,select').forEach(el => el.addEventListener('input', updatePreview));
  characters.push({ id, el: div, photos: [null,null,null,null], files: [null,null,null,null], colors: [] });
  updatePreview();
  return div;
}

function setupTags(block) {
  block.querySelectorAll('.tags').forEach(container => {
    const group = container.dataset.group;
    const textarea = block.querySelector(group === 'style' ? '.c-style' : group === 'vibe' ? '.c-vibe' : '.c-appearance');
    TAGS[group].forEach(word => {
      const el = document.createElement('span');
      el.className = 'tag';
      el.textContent = word;
      el.onclick = () => {
        const parts = textarea.value.split(/,\s*/).filter(Boolean);
        if (parts.includes(word)) {
          textarea.value = parts.filter(p => p !== word).join(', ');
          el.classList.remove('active');
        } else {
          parts.push(word);
          textarea.value = parts.join(', ');
          el.classList.add('active');
        }
        updatePreview();
      };
      container.appendChild(el);
    });
  });
}

function setupPhotos(block) {
  const grid = block.querySelector('.photos');
  const input = block.querySelector('.file-input');
  const char = characters.find(c => c.el === block);
  for (let i = 0; i < 4; i++) {
    const slot = document.createElement('div');
    slot.className = 'photo-slot';
    slot.innerHTML = `<span>Photo ${i+1}</span>`;
    slot.onclick = () => { input.dataset.idx = i; input.click(); };
    grid.appendChild(slot);
  }
  input.onchange = () => {
    const idx = parseInt(input.dataset.idx || 0);
    const file = input.files[0];
    if (!file) return;
    char.files[idx] = file;
    const reader = new FileReader();
    reader.onload = () => {
      char.photos[idx] = reader.result;
      const slot = grid.children[idx];
      slot.innerHTML = `<img src="${reader.result}"><div class="badge">${file.name.length > 12 ? 'Photo' : 'OK'}</div>`;
      extractColors(reader.result, char);
    };
    reader.readAsDataURL(file);
    input.value = '';
  };
}

function extractColors(dataUrl, char) {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = 40; c.height = 40;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, 40, 40);
    const data = ctx.getImageData(0,0,40,40).data;
    const counts = {};
    for (let i = 0; i < data.length; i += 16) {
      const r = data[i], g = data[i+1], b = data[i+2];
      const key = `#${((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}`;
      counts[key] = (counts[key]||0)+1;
    }
    char.colors = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
    updatePreview();
  };
  img.src = dataUrl;
}

function getCharData(block) {
  const h = block.querySelector('.c-height').value;
  const hu = block.querySelector('.c-hunit').value;
  const w = block.querySelector('.c-weight').value;
  const wu = block.querySelector('.c-wunit').value;
  let height = '—', weight = '—';
  if (h) height = hu === 'cm' ? `${h} cm` : `${h} cm`;
  if (w) weight = wu === 'kg' ? `${w} kg` : `${w} lbs`;
  return {
    name: block.querySelector('.c-name').value.trim() || 'CHARACTER',
    role: block.querySelector('.c-role').value || '—',
    height, weight,
    appearance: block.querySelector('.c-appearance').value.trim() || '—',
    style: block.querySelector('.c-style').value.trim() || '—',
    vibe: block.querySelector('.c-vibe').value.trim() || '—',
    notes: block.querySelector('.c-notes').value.trim() || '—'
  };
}

function buildPrompt(data, format, strength, blank) {
  const strengthText = {
    strict: 'Match the reference photos as closely as possible. Prioritize exact likeness.',
    balanced: 'Use the reference photos for identity but allow natural lighting and styling.',
    loose: 'Use the photos mainly for vibe and general look. Stylized interpretation is fine.'
  }[strength];

  const consistency = `
Consistency rules:
- Exact same person in every image. Do not change face, age, or body.
- Lock facial features, hair, beard, and skin tone from the reference photos.
- Turnaround views must match each other perfectly.
- No morphing between angles.
${strengthText}`;

  let layout = '';
  if (format === 'classic') {
    layout = `STRICT CHARACTER REFERENCE SHEET LAYOUT. Black background. Do not deviate from this structure.

LEFT SIDEBAR (narrow vertical panel, black background):
- Very large bold white text: "${data.name}"
- Small yellow text underneath: "CHARACTER SHEET"
- Status block: "ONLINE" + time + distance
- Section titled "STATS" with three lines (role, height, weight) with small icons
- Section titled "APPEARANCE" with 6–8 bullet points
- Section titled "PERSONAL STYLE" with 3–4 bullet points
- Section titled "VIBE" with one short paragraph
- Section titled "COLOR PALETTE" with exactly four color squares labeled Hair / Eyes / Skin / Beard
- Section titled "STYLE PALETTE" with exactly four color squares

TOP RIGHT (three photos in a row, labeled 01, 02, 03):
- Photo 01, Photo 02, Photo 03 using the uploaded reference images

BOTTOM CENTER (white background turnaround):
- Four full-body views side by side labeled exactly: FRONT | LEFT PROFILE | RIGHT PROFILE | BACK
- Same person across all four angles, shirtless, black pants

FAR RIGHT PANEL:
- Section titled "DETAILS" with three stacked close-up crops
- Section titled "NOTES" with a short paragraph`;
  } else if (format === 'white') {
    layout = `CLEAN WHITE CHARACTER SHEET. White background, dark text, minimal professional layout.
Large name "${data.name}", stats, appearance, style, vibe sections.
Three reference photos on top. Full-body turnaround (FRONT LEFT RIGHT BACK) at bottom. Details and notes on the right.`;
  } else {
    layout = `VERTICAL 9:16 CHARACTER SHEET for stories. Dark background.
Name "${data.name}" at top. Stacked photos, turnaround strip, key stats and vibe. Optimized for mobile viewing.`;
  }

  const blankNote = blank ? '\n\nLeave all text areas as solid color blocks (no rendered text) so labels can be overlaid cleanly later.' : '';

  return `${layout}
${consistency}
${blankNote}

Character information:
Name: ${data.name}
Height: ${data.height}
Weight: ${data.weight}
Role: ${data.role}
Appearance: ${data.appearance}
Style: ${data.style}
Vibe: ${data.vibe}
Notes: ${data.notes}
`;
}

function updatePreview() {
  const blocks = document.querySelectorAll('.char-block');
  if (!blocks.length) return;
  const data = getCharData(blocks[0]);
  const char = characters.find(c => c.el === blocks[0]);
  document.getElementById('pName').textContent = data.name;
  document.getElementById('pStats').textContent = `${data.role} · ${data.height} · ${data.weight}`;
  document.getElementById('pApp').textContent = data.appearance.slice(0, 120) + (data.appearance.length > 120 ? '…' : '');
  document.getElementById('pStyle').textContent = data.style.slice(0, 80);
  document.getElementById('pVibe').textContent = data.vibe.slice(0, 80);
  const palette = document.getElementById('pPalette');
  const sw = document.getElementById('previewSwatches');
  palette.innerHTML = '';
  sw.innerHTML = '';
  (char?.colors || []).forEach(c => {
    const d = document.createElement('div');
    d.className = 'palette-swatch';
    d.style.background = c;
    palette.appendChild(d);
    const s = document.createElement('div');
    s.className = 'swatch';
    s.style.background = c;
    sw.appendChild(s);
  });
}

document.getElementById('addChar').onclick = () => createCharBlock();
document.getElementById('save').onclick = () => {
  const data = [];
  document.querySelectorAll('.char-block').forEach(b => data.push(getCharData(b)));
  localStorage.setItem('cs-profiles', JSON.stringify(data));
  document.getElementById('status').textContent = 'Profile saved locally.';
};
document.getElementById('load').onclick = () => {
  const raw = localStorage.getItem('cs-profiles');
  if (!raw) return;
  document.getElementById('characters').innerHTML = '';
  characters = [];
  JSON.parse(raw).forEach(d => createCharBlock(d));
  document.getElementById('status').textContent = 'Loaded last profile.';
};
document.getElementById('openGrok').onclick = () => {
  const blocks = document.querySelectorAll('.char-block');
  if (!blocks.length) return;
  const data = getCharData(blocks[0]);
  const prompt = buildPrompt(data, document.getElementById('format').value, document.getElementById('strength').value, document.getElementById('blankText').checked);
  navigator.clipboard.writeText(prompt);
  document.getElementById('status').textContent = 'Prompt copied. Paste it in Grok and attach your photos.';
  window.open('https://grok.x.ai', '_blank');
};

document.getElementById('generate').onclick = async () => {
  const status = document.getElementById('status');
  const btn = document.getElementById('generate');
  btn.disabled = true;
  status.textContent = 'Building zip…';

  const format = document.getElementById('format').value;
  const strength = document.getElementById('strength').value;
  const variations = parseInt(document.getElementById('variations').value, 10);
  const blank = document.getElementById('blankText').checked;
  const turnaround = document.getElementById('turnaroundOnly').checked;

  const zip = new JSZip();
  const blocks = document.querySelectorAll('.char-block');

  for (let ci = 0; ci < blocks.length; ci++) {
    const block = blocks[ci];
    const data = getCharData(block);
    const char = characters.find(c => c.el === block);
    const folderName = blocks.length > 1 ? `character_${ci+1}_${data.name.replace(/[^a-z0-9]/gi,'_')}` : data.name.replace(/[^a-z0-9]/gi,'_') || 'character';
    const folder = zip.folder(folderName);

    for (let v = 1; v <= variations; v++) {
      let prompt = buildPrompt(data, format, strength, blank);
      if (variations > 1) prompt = `VARIATION ${v}\n\n` + prompt + `\n\nSlight lighting and crop variation ${v}.`;
      folder.file(variations > 1 ? `prompt_v${v}.txt` : 'prompt.txt', prompt);
    }

    if (turnaround) {
      folder.file('turnaround_prompt.txt', `Full-body turnaround only. White background. FRONT LEFT PROFILE RIGHT PROFILE BACK. Shirtless, black pants. Exact same person from references. Consistent face and body across all four angles.\n\n${data.name} — ${data.appearance}`);
    }

    folder.file('INSTRUCTIONS.txt', `Upload photos/ as references.\nPaste prompt.txt (or prompt_v*.txt).\nWorks in Grok, Flux, Midjourney, etc.`);

    const photosFolder = folder.folder('photos');
    let count = 0;
    for (let i = 0; i < char.files.length; i++) {
      if (char.files[i]) {
        const ext = char.files[i].name.split('.').pop() || 'png';
        photosFolder.file(`0${i+1}.${ext}`, char.files[i]);
        count++;
      }
    }
    if (char.colors.length) {
      folder.file('palette.txt', char.colors.join('\n'));
    }
  }

  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'character_sheets.zip';
  a.click();
  status.textContent = 'Downloaded character_sheets.zip';
  btn.disabled = false;
};

// Init
createCharBlock();
</script>
</body>
</html>
