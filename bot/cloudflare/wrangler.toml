name = "refsheet-bot"
main = "src/index.ts"
compatibility_date = "2026-09-29"

[[containers]]
class_name = "RefSheetBot"
image = "../Dockerfile"
instance_type = "lite"
max_instances = 1

[[durable_objects.bindings]]
name = "BOT"
class_name = "RefSheetBot"

[exports.RefSheetBot]
type = "durable-object"
storage = "sqlite"

[vars]
# Set these with: npx wrangler secret put BOT_TOKEN
# and: npx wrangler secret put ADMIN_ID

[triggers]
crons = ["*/5 * * * *"]
